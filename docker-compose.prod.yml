# ==============================================================================
# Spotify Concept Backend Production Multi-Container Orchestration
# ==============================================================================
# Architecture:
# - adnan-spotify-postgres: Private, isolated PostgreSQL (Internal only, port not exposed)
# - adnan-spotify-redis: Private, isolated Redis cache / socket pubsub
# - adnan-spotify-api: Express & Socket.IO backend on Host Port 9888 (Internal 5000)
# ==============================================================================

name: spotify-backend-production

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Private & Isolated)
  # ----------------------------------------------------------------------------
  adnan-spotify-postgres:
    image: postgres:16-alpine
    container_name: adnan-spotify-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SpotifyDbPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-spotify_sync_rooms}
    volumes:
      - spotify_postgres_data:/var/lib/postgresql/data
    networks:
      - spotify_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-spotify_sync_rooms}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Socket.IO Adapter Service (Private & Isolated)
  # ----------------------------------------------------------------------------
  adnan-spotify-redis:
    image: redis:7-alpine
    container_name: adnan-spotify-redis
    restart: always
    volumes:
      - spotify_redis_data:/data
    networks:
      - spotify_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Express.js & Socket.IO Application Server
  # ----------------------------------------------------------------------------
  app:
    image: ghcr.io/${IMAGE_REPO:-ebadzmn}/spotify-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adnan-spotify-api
    restart: always
    ports:
      - "${HOST_PORT:-9888}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-SpotifyDbPass2026!}@adnan-spotify-postgres:5432/${POSTGRES_DB:-spotify_sync_rooms}?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://adnan-spotify-redis:6379}
      - JWT_SECRET=${JWT_SECRET:-c8f93e6b21d5a840e791b6f04c83d5a1928471e0b5c43d928a7e1f6d3b5c8a90}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MAX_ROOM_MEMBERS=${MAX_ROOM_MEMBERS:-50}
      - ROOM_IDLE_TTL=${ROOM_IDLE_TTL:-1800}
      - SYNC_INTERVAL_MS=${SYNC_INTERVAL_MS:-5000}
      - SCHEDULE_BUFFER_MS=${SCHEDULE_BUFFER_MS:-1500}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-120}
    depends_on:
      adnan-spotify-postgres:
        condition: service_healthy
      adnan-spotify-redis:
        condition: service_healthy
    networks:
      - spotify_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (res) => { if (res.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

# ------------------------------------------------------------------------------
# Persistent Docker Volumes
# ------------------------------------------------------------------------------
volumes:
  spotify_postgres_data:
    name: adnan_spotify_postgres_data
  spotify_redis_data:
    name: adnan_spotify_redis_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  spotify_network:
    name: adnan_spotify_network
    driver: bridge
